openapi: 3.0.3
info:
  title: Offday API
  version: 1.0.0
  description: |
    Vacation request management, multi-tenant (workspace > office > users).
    Routes are dispatched by commoneventframework from this file (x-handler / x-inputParser).
    Full contract: docs/api-contract.md. Note: CEF reads every key under a path as an HTTP method,
    so parameters are declared per operation.
tags:
  - name: Auth
  - name: My requests
  - name: Review
  - name: Office
  - name: Invitations
  - name: System
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: object }
    Period:
      type: object
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date-time, example: "2026-11-03T09:00:00+02:00" }
        endDate: { type: string, format: date-time, example: "2026-11-03T13:00:00+02:00" }
        reason: { type: string, maxLength: 240, nullable: true }
  responses:
    Error:
      description: Error in the contract's format
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
security:
  - bearer: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      x-handler: handlers/health#getHealth
      summary: Service and database health check
      responses:
        "200": { description: Service and database are reachable }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      x-inputParser: handlers/auth#parseLogin
      x-handler: handlers/auth#login
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: lina@acme.io }
                password: { type: string, example: demo1234 }
      responses:
        "200": { description: "{ token, user }" }
        "401": { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [Auth]
      x-inputParser: handlers/auth#parseAuthenticated
      x-handler: handlers/auth#getMe
      summary: The signed-in user, office and workspace
      responses:
        "200": { description: Me }

  /me/balance:
    get:
      tags: [My requests]
      x-inputParser: handlers/auth#parseBalance
      x-handler: handlers/auth#getMyBalance
      summary: Leave balance for a year (25-day allowance)
      parameters:
        - { in: query, name: year, schema: { type: integer } }
      responses:
        "200": { description: "{ year, allowance, usedDays, pendingDays, remainingDays }" }

  /requests/mine:
    get:
      tags: [My requests]
      x-inputParser: handlers/requests#parseListMine
      x-handler: handlers/requests#listMine
      summary: The caller's own requests (paginated)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [Pending, Approved, Rejected] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 6 } }
      responses:
        "200": { description: "{ items, total, page, pageSize }" }

  /requests:
    get:
      tags: [Review]
      x-inputParser: handlers/review#parseListOffice
      x-handler: handlers/review#listOffice
      summary: All requests in the caller's office (Validator, WorkspaceAdmin)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [Pending, Approved, Rejected] } }
        - { in: query, name: userId, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 6 } }
      responses:
        "200": { description: "{ items, total, page, pageSize, counts }" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [My requests]
      x-inputParser: handlers/requests#parseCreate
      x-handler: handlers/requests#createRequest
      summary: Submit a vacation request (CreateVacationRequestCommand)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Period" }
      responses:
        "201": { description: The created request }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /requests/:id:
    put:
      tags: [My requests]
      x-inputParser: handlers/requests#parseUpdate
      x-handler: handlers/requests#updateRequest
      summary: Edit an own Pending request (UpdateVacationRequestCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Period" }
      responses:
        "200": { description: The updated request }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [My requests]
      x-inputParser: handlers/requests#parseWithdraw
      x-handler: handlers/requests#withdrawRequest
      summary: Withdraw an own Pending request (WithdrawVacationRequestCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Withdrawn }
        "409": { $ref: "#/components/responses/Error" }

  /requests/:id/approve:
    post:
      tags: [Review]
      x-inputParser: handlers/review#parseApprove
      x-handler: handlers/review#approveRequest
      summary: Approve a Pending request (ApproveVacationRequestCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: The approved request }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /requests/:id/reject:
    post:
      tags: [Review]
      x-inputParser: handlers/review#parseReject
      x-handler: handlers/review#rejectRequest
      summary: Reject a Pending request with a comment (RejectVacationRequestCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 500 }
      responses:
        "200": { description: The rejected request }
        "400": { $ref: "#/components/responses/Error" }

  /stats/overview:
    get:
      tags: [Review]
      x-inputParser: handlers/review#parseOverview
      x-handler: handlers/review#overview
      summary: Office KPIs and monthly chart data (Validator, WorkspaceAdmin)
      parameters:
        - { in: query, name: year, schema: { type: integer } }
      responses:
        "200": { description: Overview }

  /team/calendar:
    get:
      tags: [Office]
      x-inputParser: handlers/office#parseCalendar
      x-handler: handlers/office#teamCalendar
      summary: Office members and their Pending/Approved requests in a range
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: "{ users, requests }" }

  /office/users:
    get:
      tags: [Office]
      x-inputParser: handlers/auth#parseAuthenticated
      x-handler: handlers/office#officeUsers
      summary: Users of the caller's office (Validator, WorkspaceAdmin)
      responses:
        "200": { description: "UserSummary[]" }

  /users/:id/role:
    put:
      tags: [Office]
      x-inputParser: handlers/office#parseChangeRole
      x-handler: handlers/office#changeRole
      summary: Change a user's role (WorkspaceAdmin; ChangeUserRoleCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Requester, Validator, WorkspaceAdmin] }
      responses:
        "200": { description: UserSummary }
        "403": { $ref: "#/components/responses/Error" }

  /office:
    get:
      tags: [Office]
      x-inputParser: handlers/auth#parseAuthenticated
      x-handler: handlers/office#getOffice
      summary: The caller's office and workspace
      responses:
        "200": { description: Office }

  /office/timezone:
    put:
      tags: [Office]
      x-inputParser: handlers/office#parseTimezone
      x-handler: handlers/office#updateTimezone
      summary: Change the office time zone (WorkspaceAdmin; UpdateOfficeTimezoneCommand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: { type: string, example: Asia/Jerusalem }
      responses:
        "200": { description: Office }
        "400": { $ref: "#/components/responses/Error" }

  /workspace/offices:
    get:
      tags: [Office]
      x-inputParser: handlers/auth#parseAuthenticated
      x-handler: handlers/office#workspaceOffices
      summary: Every office of the caller's workspace with its headcount per role (WorkspaceAdmin)
      responses:
        "200": { description: "WorkspaceOffice[]" }
        "403": { $ref: "#/components/responses/Error" }

  /offices/:id:
    get:
      tags: [Office]
      x-inputParser: handlers/office#parseOfficeId
      x-handler: handlers/office#getWorkspaceOffice
      summary: An office of the caller's workspace (WorkspaceAdmin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Office }
        "404": { $ref: "#/components/responses/Error" }

  /offices/:id/users:
    get:
      tags: [Office]
      x-inputParser: handlers/office#parseOfficeId
      x-handler: handlers/office#workspaceOfficeUsers
      summary: Users of an office of the caller's workspace (WorkspaceAdmin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: "UserSummary[]" }
        "404": { $ref: "#/components/responses/Error" }

  /offices/:id/timezone:
    put:
      tags: [Office]
      x-inputParser: handlers/office#parseOfficeTimezone
      x-handler: handlers/office#updateTimezone
      summary: Change an office's time zone (WorkspaceAdmin of the same workspace; UpdateOfficeTimezoneCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: { type: string, example: Europe/Paris }
      responses:
        "200": { description: Office }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /offices/:id/work-week:
    put:
      tags: [Office]
      x-inputParser: handlers/office#parseOfficeWorkWeek
      x-handler: handlers/office#updateWorkWeek
      summary: Set an office's working days (WorkspaceAdmin of the same workspace; UpdateOfficeWorkWeekCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workDays]
              properties:
                workDays:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 7 }
      responses:
        "200": { description: Office }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /offices/:id/invitations:
    get:
      tags: [Invitations]
      x-inputParser: handlers/invitations#parseListInvitations
      x-handler: handlers/invitations#listInvitations
      summary: Invite links of an office of the caller's workspace, newest first (WorkspaceAdmin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: "InvitationSummary[] (never the token or its hash)" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Invitations]
      x-inputParser: handlers/invitations#parseCreateInvitation
      x-handler: handlers/invitations#createInvitation
      summary: Create an invite link for an office of the caller's workspace (WorkspaceAdmin; CreateInvitationCommand)
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [personal, team] }
                role: { type: string, enum: [Requester, Validator, WorkspaceAdmin], default: Requester }
                email: { type: string, description: "Personal links only" }
                maxUses: { type: integer, minimum: 1, maximum: 200, description: "Team links only, default 25" }
                expiresInDays: { type: integer, minimum: 1, maximum: 30, description: "Default 7 (3 for admin links, which allow at most 3)" }
                label: { type: string, maxLength: 80 }
      responses:
        "201": { description: "{ invitation: InvitationSummary, token } — the token is returned only here" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /offices/:officeId/invitations/:invitationId:
    delete:
      tags: [Invitations]
      x-inputParser: handlers/invitations#parseRevokeInvitation
      x-handler: handlers/invitations#revokeInvitation
      summary: Revoke an invite link; idempotent (WorkspaceAdmin; RevokeInvitationCommand)
      parameters:
        - { in: path, name: officeId, required: true, schema: { type: integer } }
        - { in: path, name: invitationId, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /invitations/preview:
    post:
      tags: [Invitations]
      security: []
      x-inputParser: handlers/invitations#parsePreviewInvitation
      x-handler: handlers/invitations#previewInvitation
      summary: What an invite link is for (public; the token travels in the body, never in the URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200": { description: "{ workspace: { name }, office: { name }, role, email, expiresAt }" }
        "404": { $ref: "#/components/responses/Error" }

  /invitations/accept:
    post:
      tags: [Invitations]
      security: []
      x-inputParser: handlers/invitations#parseAcceptInvitation
      x-handler: handlers/invitations#acceptInvitation
      summary: Create an account through an invite link and sign in (public; AcceptInvitationCommand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, email, password]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                name: { type: string, maxLength: 120 }
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 10, description: "At most 72 bytes in UTF-8, not the email" }
      responses:
        "201": { description: "{ token, user } — same shape as POST /auth/login" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /holidays:
    get:
      tags: [Office]
      x-inputParser: handlers/holidays#parseHolidays
      x-handler: handlers/holidays#listHolidays
      summary: Religious holidays in a date range, from Google's public holiday calendars (all roles)
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - { in: query, name: calendars, schema: { type: string, example: "jewish,christian,muslim,hindu" } }
      responses:
        "200": { description: "{ calendars, holidays, unavailable }" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /office/work-week:
    put:
      tags: [Office]
      x-inputParser: handlers/office#parseWorkWeek
      x-handler: handlers/office#updateWorkWeek
      summary: Set the office's working days (WorkspaceAdmin; UpdateOfficeWorkWeekCommand)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workDays]
              properties:
                workDays:
                  type: array
                  description: ISO weekdays, 1 = Monday ... 7 = Sunday
                  items: { type: integer, minimum: 1, maximum: 7 }
                  example: [7, 1, 2, 3, 4]
      responses:
        "200": { description: Office }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
