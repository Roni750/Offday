# Releases one commit to production, in dependency order:
#   database migrations -> API (Lambda) -> API smoke test -> web app (Netlify) -> web smoke test
# If a step fails, nothing after it ships, so the live web app never runs ahead of the API it talks to.
#
# Called by "Checks" after a green run on main, with only the parts that changed. Can also be started by hand
# from the Actions tab (main only): pick what to deploy, and optionally an older commit to roll back to.
name: Deploy

on:
  workflow_call:
    inputs:
      api:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      api:
        description: Deploy the API (migrations + Lambda)
        type: boolean
        default: true
      web:
        description: Deploy the web app (Netlify)
        type: boolean
        default: true
      ref:
        description: Commit to deploy (empty = latest main). An older SHA rolls back to it
        type: string
        default: ""

permissions:
  contents: read
  id-token: write   # lets the API job sign in to AWS with a short-lived role (OIDC), no stored AWS keys

jobs:
  api:
    name: API (migrate, deploy, smoke test)
    if: github.ref == 'refs/heads/main' && inputs.api
    runs-on: ubuntu-latest
    # Holds the secrets; add required reviewers to it in GitHub to approve each production deploy.
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    # Deploys run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # Schema first: the new Lambda code may rely on it. Migrations must be backwards compatible
      # (expand/contract, see decisions.md #13), since the old Lambda keeps serving until the next step.
      - name: Run database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DB_SSL: "true"
        run: |
          export DB_CA_CERT="$(cat certs/supabase-ca.crt)"
          npm run migration:run

      # deploy.mjs reads backend/.env.lambda; here it's written from the environment's secrets.
      - name: Write the Lambda environment
        env:
          DATABASE_URL: ${{ secrets.LAMBDA_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          FRONT_END_URL: ${{ vars.FRONT_END_URL || '*' }}
        run: |
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DB_SSL=true\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRES_IN=%s\n' "$JWT_EXPIRES_IN"
            printf 'FRONT_END_URL=%s\n' "$FRONT_END_URL"
          } > .env.lambda

      - run: npm run deploy

      - name: Smoke test the API
        id: smoke
        run: |
          url="$(aws lambda get-function-url-config --function-name vacation-manager-api --query FunctionUrl --output text)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${url}health" | tee /dev/stderr | grep -q '"db":"up"'; then
              echo "API: deployed \`$(git rev-parse --short HEAD)\` to ${url} (health: db up)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${url}health didn't report a healthy database"
          exit 1

      - name: Remove the Lambda environment file
        if: always()
        run: rm -f .env.lambda

  web:
    name: Web app (build, publish, smoke test)
    needs: api
    # Runs after a successful API deploy, or on its own when the API wasn't part of this release.
    if: >-
      always() && !cancelled()
      && github.ref == 'refs/heads/main' && inputs.web
      && (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    # Same environment as the API, so production's secrets and approvals live in one place.
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "::error::Set the VITE_API_URL variable on the production environment"; exit 1; fi
          npm run build

      # Netlify's own production builds are skipped (frontend/netlify.toml), so this is the only path to production.
      - name: Publish to Netlify
        id: publish
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          npx --yes netlify-cli@17 deploy --prod --dir dist --site "$NETLIFY_SITE_ID" \
            --message "GitHub Actions: $sha" --json > deploy.json
          echo "url=$(jq -r .url deploy.json)" >> "$GITHUB_OUTPUT"

      # The app shell, plus a deep link: proves the SPA redirect (public/_redirects) shipped too.
      - name: Smoke test the web app
        env:
          URL: ${{ steps.publish.outputs.url }}
        run: |
          curl -fsS "$URL/" | grep -q 'id="app"'
          curl -fsS "$URL/requests/mine" | grep -q 'id="app"'
          echo "Web: published \`$(git rev-parse --short HEAD)\` to $URL" >> "$GITHUB_STEP_SUMMARY"
