# Checks every push and pull request; on main, deploys the backend when it changed.
# Order on main: tests -> database migrations -> Lambda code. The frontend is built and published by Netlify.
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the backend even if nothing under backend/ changed
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch cancels the checks of the older one (never a running deploy, see below).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    name: Backend (typecheck, unit, e2e)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same database as docker-compose.yml, on the port the e2e suite expects by default.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: offday
          POSTGRES_PASSWORD: offday
          POSTGRES_DB: offday
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U offday"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - name: Upload the API log of a failed e2e run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: backend/tests/e2e/server.log

  frontend:
    name: Frontend (typecheck, unit, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # `build` runs vue-tsc first, so it also typechecks.
      - run: npm run build

  deploy-backend:
    name: Deploy backend (migrations + Lambda)
    needs: [changes, backend, frontend]
    # Skipped jobs (e.g. frontend when only backend changed) don't block; failed ones do.
    if: >-
      always() && !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.backend.result == 'success'
      && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
      && (needs.changes.outputs.backend == 'true' || inputs.deploy)
    runs-on: ubuntu-latest
    # Holds the secrets; add required reviewers to it in GitHub to approve each production deploy.
    environment: production
    # Deploys run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # lets the job sign in to AWS with a short-lived role (OIDC), no stored AWS keys
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # Schema first: the new Lambda code may rely on it (e.g. a renamed role).
      # Migrations must be backwards compatible, since the old Lambda keeps serving until the next step.
      - name: Run database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DB_SSL: "true"
        run: |
          export DB_CA_CERT="$(cat certs/supabase-ca.crt)"
          npm run migration:run

      # deploy.mjs reads backend/.env.lambda; in CI it's written from the environment's secrets.
      - name: Write the Lambda environment
        env:
          DATABASE_URL: ${{ secrets.LAMBDA_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          FRONT_END_URL: ${{ vars.FRONT_END_URL || '*' }}
        run: |
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DB_SSL=true\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRES_IN=%s\n' "$JWT_EXPIRES_IN"
            printf 'FRONT_END_URL=%s\n' "$FRONT_END_URL"
          } > .env.lambda

      - run: npm run deploy

      - name: Smoke test the deployed API
        run: |
          url="$(aws lambda get-function-url-config --function-name vacation-manager-api --query FunctionUrl --output text)"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${url}health" | tee /dev/stderr | grep -q '"db":"up"'; then exit 0; fi
            sleep 5
          done
          echo "::error::${url}health didn't report a healthy database"
          exit 1

      - name: Remove the Lambda environment file
        if: always()
        run: rm -f .env.lambda
