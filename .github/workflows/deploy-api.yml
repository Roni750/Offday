# Deploys the API: database migrations first, then the Lambda code, then a smoke test against the live URL.
# Called by "Checks" after a green run on main. Can also be started by hand from the Actions tab (main only),
# e.g. to redeploy after rotating a secret.
name: Deploy API

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job sign in to AWS with a short-lived role (OIDC), no stored AWS keys

jobs:
  deploy:
    name: Migrate, deploy and smoke test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the secrets; add required reviewers to it in GitHub to approve each production deploy.
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    # Deploys run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # Schema first: the new Lambda code may rely on it (e.g. a renamed role).
      # Migrations must be backwards compatible, since the old Lambda keeps serving until the next step.
      - name: Run database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DB_SSL: "true"
        run: |
          export DB_CA_CERT="$(cat certs/supabase-ca.crt)"
          npm run migration:run

      # deploy.mjs reads backend/.env.lambda; here it's written from the environment's secrets.
      - name: Write the Lambda environment
        env:
          DATABASE_URL: ${{ secrets.LAMBDA_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          FRONT_END_URL: ${{ vars.FRONT_END_URL || '*' }}
        run: |
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DB_SSL=true\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRES_IN=%s\n' "$JWT_EXPIRES_IN"
            printf 'FRONT_END_URL=%s\n' "$FRONT_END_URL"
          } > .env.lambda

      - run: npm run deploy

      - name: Smoke test the deployed API
        id: smoke
        run: |
          url="$(aws lambda get-function-url-config --function-name vacation-manager-api --query FunctionUrl --output text)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${url}health" | tee /dev/stderr | grep -q '"db":"up"'; then
              echo "Deployed \`${GITHUB_SHA::7}\` to ${url} (health: db up)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${url}health didn't report a healthy database"
          exit 1

      - name: Remove the Lambda environment file
        if: always()
        run: rm -f .env.lambda
